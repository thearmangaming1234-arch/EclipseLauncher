<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eclipse Client</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            background: transparent !important;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Root Container */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            background: transparent;
        }

        /* Solid Pitch Black Sidebar */
        .sidebar {
            width: 75px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            -webkit-app-region: drag;
            z-index: 10;
        }

        .sidebar-top, .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            -webkit-app-region: no-drag;
        }

        .client-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: transparent;
            border: none;
            color: #555555;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            color: #000000;
            box-shadow: 0 4px 16px rgba(255, 183, 3, 0.35);
        }

        /* Right Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        /* Solid Pitch Black Top Bar */
        .top-bar {
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background-color: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            -webkit-app-region: drag;
            z-index: 10;
        }

        .title-text {
            font-family: 'Montserrat', 'Trebuchet MS', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .top-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        .social-btn {
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 20px;
            color: #5865F2;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: rgba(88, 101, 242, 0.15);
            border-color: #5865F2;
        }

        .discord-icon {
            width: 18px;
            height: 18px;
            fill: #5865F2;
        }

        .account-box {
            background: #0d0d0d;
            padding: 6px 14px 6px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.2s;
        }

        .account-box:hover {
            border-color: #ffb703;
        }

        .account-avatar {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }

        .window-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }

        .win-btn {
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888888;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .win-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        .win-btn.close:hover {
            background: #e63946;
            border-color: #e63946;
            color: #fff;
        }

        /* Glassmorphism Main Dashboard Area */
        .dashboard {
            padding: 25px 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background-color: rgba(18, 18, 18, 0.70);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .dashboard::-webkit-scrollbar { width: 8px; }
        .dashboard::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 8px; margin: 10px 0; }
        .dashboard::-webkit-scrollbar-thumb { background: rgba(255, 183, 3, 0.3); border-radius: 8px; border: 1px solid rgba(255, 183, 3, 0.1); }
        .dashboard::-webkit-scrollbar-thumb:hover { background: rgba(255, 183, 3, 0.7); }

        .tab-content { display: none; width: 100%; }
        .tab-content.active-tab { display: flex; flex-direction: column; }

        .launch-section { width: 100%; display: flex; flex-direction: column; gap: 20px; }

        .version-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .version-pills { display: flex; gap: 8px; margin-bottom: 20px; }

        .pill {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #777777;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .pill.active {
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            border-color: #ffb703;
        }

        .play-btn-wrapper {
            display: flex;
            width: 100%;
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(255, 183, 3, 0.25);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }

        .play-btn-wrapper:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(255, 183, 3, 0.45);
        }

        .play-btn {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px;
            color: #000000;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
        }

        .status-text {
            margin-top: 14px;
            font-size: 13px;
            color: #888888;
            text-align: center;
        }

        /* Settings Card */
        .settings-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .settings-header {
            font-size: 18px;
            font-weight: 700;
            color: #ffb703;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .setting-group { display: flex; flex-direction: column; gap: 8px; }

        .setting-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #dddddd;
        }

        .ram-badge {
            background: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }

        .ram-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #1a1a1a;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ram-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        .text-input, .select-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0d0d0d;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .select-input option { background: #0d0d0d; color: #fff; }
        .text-input:focus, .select-input:focus { border-color: #ffb703; }

        .res-row { display: flex; gap: 12px; align-items: center; }

        .res-input-container { display: flex; align-items: center; gap: 6px; flex: 1; }
        .res-input-container input { width: 80px; text-align: center; }

        .toggle-container { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-left: auto; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { display: none; }

        .slider-round {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a1a1a; transition: .3s; border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-round:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: #888888; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider-round { background-color: rgba(255, 183, 3, 0.2); border-color: #ffb703; }
        input:checked + .slider-round:before { transform: translateX(18px); background-color: #ffb703; }

        .folder-row { display: flex; gap: 10px; }

        .folder-btn {
            background: #1a1a1a; color: #ffb703; border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: background 0.2s;
        }

        .folder-btn:hover { background: rgba(255, 183, 3, 0.15); }

        .settings-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; }

        .settings-btn {
            padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; border: none; transition: all 0.2s;
        }

        .save-btn { background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%); color: #000000; }
        .save-btn:hover { box-shadow: 0 4px 14px rgba(255, 183, 3, 0.35); transform: translateY(-1px); }

        .reset-btn { background: #1a1a1a; color: #888888; border: 1px solid rgba(255, 255, 255, 0.1); }
        .reset-btn:hover { background: #252525; color: #ffffff; }

        /* MULTI-TAB ACCOUNT MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100;
        }

        .modal-content {
            background: #000000; padding: 25px; border-radius: 16px;
            border: 1px solid #ffb703; display: flex; flex-direction: column;
            gap: 16px; width: 340px; box-shadow: 0 0 30px rgba(255, 183, 3, 0.2);
        }

        .auth-type-tabs {
            display: flex; gap: 6px; background: #0a0a0a; padding: 4px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-tab-btn {
            flex: 1; padding: 8px; border: none; border-radius: 6px; background: transparent;
            color: #777777; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }

        .auth-tab-btn.active { background: #1a1a1a; color: #ffb703; }

        .auth-panel { display: none; flex-direction: column; gap: 12px; }
        .auth-panel.active { display: flex; }

        .ms-login-btn {
            background: #00a4ef; color: #ffffff; font-weight: bold; padding: 12px;
            border: none; border-radius: 8px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; font-size: 13px;
            transition: background 0.2s;
        }

        .ms-login-btn:hover { background: #0078d4; }

        .modal-content input {
            padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0d0d0d; color: #fff; outline: none;
        }

        .modal-content input:focus { border-color: #ffb703; }
        .modal-error { color: #ff4d4d; font-size: 12px; display: none; line-height: 1.3; }

        .modal-buttons { display: flex; gap: 10px; }

        .modal-content button.action-btn {
            flex: 1; background: #ffb703; color: #000000; font-weight: bold;
            padding: 12px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }

        .modal-content button.action-btn:hover { background: #fb8500; }

        .modal-content button.cancel-btn { flex: 1; background: #222222; color: #aaaaaa; border: none; border-radius: 8px; cursor: pointer; }
        .modal-content button.cancel-btn:hover { background: #333333; color: #ffffff; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-top">
                <img src="assets/logo.png" class="client-logo" alt="Logo" onerror="this.style.display='none'">
                <button class="nav-btn active" id="navPlayBtn" title="Play">▶</button>
            </div>
            <div class="sidebar-bottom">
                <button class="nav-btn" id="navSettingsBtn" title="Settings">⚙</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="title-text">ECLIPSE</div>

                <div class="top-right-controls">
                    <button class="social-btn" id="discordBtn" title="Join Discord">
                        <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,3.36,6.83A97.68,97.68,0,0,0,42.29,6.83,71.21,71.21,0,0,0,45.66,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36a77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.68,1.75,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22C129.24,52.84,121.72,29.13,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.08,65.69,84.69,65.69Z"/>
                        </svg>
                    </button>

                    <div class="account-box" id="accountBtn">
                        <img id="avatarImg" class="account-avatar" src="https://mc-heads.net/avatar/steve/26" alt="Head">
                        <span id="accountName" style="font-size: 13px; font-weight: 600;">No Account</span>
                    </div>

                    <div class="window-actions">
                        <button class="win-btn" id="minBtn">−</button>
                        <button class="win-btn close" id="closeBtn">✕</button>
                    </div>
                </div>
            </div>

            <!-- Dashboard Container -->
            <div class="dashboard">
                <div class="tab-content active-tab" id="playTab">
                    <div class="launch-section">
                        <div class="version-card">
                            <div class="version-pills">
                                <div class="pill active">1.20.1</div>
                            </div>

                            <div class="play-btn-wrapper" id="playBtnWrapper">
                                <button class="play-btn" id="playBtn">LAUNCH</button>
                            </div>

                            <div class="status-text" id="statusMsg">Ready to launch</div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="settingsTab">
                    <div class="settings-card">
                        <div class="settings-header">Client Settings</div>

                        <div class="setting-group">
                            <div class="setting-label-row">
                                <span>Memory Allocation</span>
                                <span class="ram-badge" id="ramValue">4096 MB</span>
                            </div>
                            <input type="range" class="ram-slider" id="ramSlider" min="1024" max="16384" step="512" value="4096">
                        </div>

                        <div class="setting-group">
                            <div class="setting-label-row"><span>Launcher Action on Game Launch</span></div>
                            <select class="select-input" id="launcherBehavior">
                                <option value="hide">Hide Launcher (Default)</option>
                                <option value="close">Close Launcher Completely</option>
                                <option value="keep">Keep Launcher Open</option>
                            </select>
                        </div>

                        <div class="setting-group">
                            <div class="setting-label-row"><span>Game Resolution</span></div>
                            <div class="res-row">
                                <div class="res-input-container">
                                    <input type="number" class="text-input" id="resWidth" value="854" placeholder="Width">
                                    <span style="color: #666;">x</span>
                                    <input type="number" class="text-input" id="resHeight" value="480" placeholder="Height">
                                </div>
                                <div class="toggle-container">
                                    <span style="font-size: 12px; color: #aaa;">Fullscreen</span>
                                    <label class="switch">
                                        <input type="checkbox" id="fullscreenToggle">
                                        <span class="slider-round"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="setting-group">
                            <div class="setting-label-row"><span>Custom JVM Arguments</span></div>
                            <input type="text" class="text-input" id="jvmFlags" placeholder="e.g. -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions">
                        </div>

                        <div class="setting-group">
                            <div class="setting-label-row"><span>Client Folder Location</span></div>
                            <div class="folder-row">
                                <input type="text" class="text-input" id="folderPath" readonly value="Loading folder path...">
                                <button class="folder-btn" id="openFolderBtn">Open Folder</button>
                            </div>
                        </div>

                        <div class="settings-actions">
                            <button class="settings-btn reset-btn" id="resetSettingsBtn">Reset Defaults</button>
                            <button class="settings-btn save-btn" id="saveSettingsBtn">Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Multi-Auth Account Modal -->
    <div class="modal" id="accountModal">
        <div class="modal-content">
            <h3 style="font-size: 16px; color: #ffb703; text-align: center;">Account Login</h3>
            
            <div class="auth-type-tabs">
                <button class="auth-tab-btn active" id="tabMsBtn">Microsoft</button>
                <button class="auth-tab-btn" id="tabCrackedBtn">Cracked</button>
            </div>

            <!-- Microsoft Auth Panel -->
            <div class="auth-panel active" id="msPanel">
                <p style="font-size: 12px; color: #aaa; text-align: center;">Log in with official Minecraft account to play on Hypixel & Premium servers.</p>
                <button class="ms-login-btn" id="msLoginBtn">
                    <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
                    Login via Microsoft
                </button>
            </div>

            <!-- Cracked Auth Panel -->
            <div class="auth-panel" id="crackedPanel">
                <input type="text" id="usernameInput" placeholder="Offline Username..." maxlength="16" />
                <button class="action-btn" id="saveCrackedBtn">Save Offline Account</button>
            </div>

            <div class="modal-error" id="modalError"></div>

            <div class="modal-buttons">
                <button class="cancel-btn" id="cancelAccountBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer, shell } = require('electron');

        const DEFAULTS = {
            ram: "4096",
            behavior: "hide",
            width: "854",
            height: "480",
            fullscreen: false,
            jvmFlags: ""
        };

        /* Navigation */
        const navPlayBtn = document.getElementById('navPlayBtn');
        const navSettingsBtn = document.getElementById('navSettingsBtn');
        const playTab = document.getElementById('playTab');
        const settingsTab = document.getElementById('settingsTab');

        navPlayBtn.addEventListener('click', () => {
            navPlayBtn.classList.add('active');
            navSettingsBtn.classList.remove('active');
            playTab.classList.add('active-tab');
            settingsTab.classList.remove('active-tab');
        });

        navSettingsBtn.addEventListener('click', () => {
            navSettingsBtn.classList.add('active');
            navPlayBtn.classList.remove('active');
            settingsTab.classList.add('active-tab');
            playTab.classList.remove('active-tab');
        });

        /* Settings Bindings */
        const ramSlider = document.getElementById('ramSlider');
        const ramValue = document.getElementById('ramValue');
        const launcherBehavior = document.getElementById('launcherBehavior');
        const resWidth = document.getElementById('resWidth');
        const resHeight = document.getElementById('resHeight');
        const fullscreenToggle = document.getElementById('fullscreenToggle');
        const jvmFlags = document.getElementById('jvmFlags');
        const folderPath = document.getElementById('folderPath');
        const openFolderBtn = document.getElementById('openFolderBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');

        ipcRenderer.send('get-game-path');
        ipcRenderer.on('game-path', (event, pathStr) => { folderPath.value = pathStr; });
        openFolderBtn.addEventListener('click', () => { if (folderPath.value) shell.openPath(folderPath.value); });

        function loadSettings() {
            ramSlider.value = localStorage.getItem('eclipse_ram') || DEFAULTS.ram;
            ramValue.innerText = `${ramSlider.value} MB`;
            launcherBehavior.value = localStorage.getItem('eclipse_behavior') || DEFAULTS.behavior;
            resWidth.value = localStorage.getItem('eclipse_width') || DEFAULTS.width;
            resHeight.value = localStorage.getItem('eclipse_height') || DEFAULTS.height;
            fullscreenToggle.checked = (localStorage.getItem('eclipse_fullscreen') === 'true');
            jvmFlags.value = localStorage.getItem('eclipse_jvm') || DEFAULTS.jvmFlags;
        }
        loadSettings();

        ramSlider.addEventListener('input', (e) => { ramValue.innerText = `${e.target.value} MB`; });

        saveSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('eclipse_ram', ramSlider.value);
            localStorage.setItem('eclipse_behavior', launcherBehavior.value);
            localStorage.setItem('eclipse_width', resWidth.value);
            localStorage.setItem('eclipse_height', resHeight.value);
            localStorage.setItem('eclipse_fullscreen', fullscreenToggle.checked);
            localStorage.setItem('eclipse_jvm', jvmFlags.value);

            saveSettingsBtn.innerText = "Saved!";
            setTimeout(() => { saveSettingsBtn.innerText = "Save Changes"; }, 1500);
        });

        resetSettingsBtn.addEventListener('click', () => {
            ramSlider.value = DEFAULTS.ram;
            ramValue.innerText = `${DEFAULTS.ram} MB`;
            launcherBehavior.value = DEFAULTS.behavior;
            resWidth.value = DEFAULTS.width;
            resHeight.value = DEFAULTS.height;
            fullscreenToggle.checked = DEFAULTS.fullscreen;
            jvmFlags.value = DEFAULTS.jvmFlags;
        });

        /* ACCOUNT MANAGEMENT SYSTEM */
        let currentAuthType = localStorage.getItem('eclipse_auth_type') || 'cracked'; 
        let savedUser = localStorage.getItem('eclipse_username') || null;

        updateAccountUI(savedUser);

        function validateMinecraftUsername(username) {
            return /^[a-zA-Z0-9_]{3,16}$/.test(username);
        }

        function updateAccountUI(username) {
            if (!username) {
                document.getElementById('accountName').innerText = "No Account";
                document.getElementById('avatarImg').src = `https://mc-heads.net/avatar/steve/26`;
            } else {
                document.getElementById('accountName').innerText = username;
                document.getElementById('avatarImg').src = `https://mc-heads.net/avatar/${username}/26`;
            }
        }

        /* Modal Logic */
        const modal = document.getElementById('accountModal');
        const modalError = document.getElementById('modalError');
        const tabMsBtn = document.getElementById('tabMsBtn');
        const tabCrackedBtn = document.getElementById('tabCrackedBtn');
        const msPanel = document.getElementById('msPanel');
        const crackedPanel = document.getElementById('crackedPanel');
        const usernameInput = document.getElementById('usernameInput');

        tabMsBtn.addEventListener('click', () => {
            tabMsBtn.classList.add('active');
            tabCrackedBtn.classList.remove('active');
            msPanel.classList.add('active');
            crackedPanel.classList.remove('active');
            modalError.style.display = 'none';
        });

        tabCrackedBtn.addEventListener('click', () => {
            tabCrackedBtn.classList.add('active');
            tabMsBtn.classList.remove('active');
            crackedPanel.classList.add('active');
            msPanel.classList.remove('active');
            modalError.style.display = 'none';
        });

        document.getElementById('accountBtn').addEventListener('click', () => {
            modalError.style.display = 'none';
            if (currentAuthType === 'cracked') {
                usernameInput.value = localStorage.getItem('eclipse_username') || '';
            }
            modal.style.display = 'flex';
        });

        document.getElementById('cancelAccountBtn').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        /* Save Cracked Account */
        document.getElementById('saveCrackedBtn').addEventListener('click', () => {
            const val = usernameInput.value.trim();
            if (!validateMinecraftUsername(val)) {
                modalError.innerText = "Invalid username! 3-16 letters, numbers, or underscores.";
                modalError.style.display = 'block';
                return;
            }

            localStorage.setItem('eclipse_auth_type', 'cracked');
            localStorage.setItem('eclipse_username', val);
            localStorage.removeItem('eclipse_ms_token'); // Clear MS Token

            currentAuthType = 'cracked';
            updateAccountUI(val);
            modal.style.display = 'none';
            statusMsg.innerText = "Ready to launch";
            statusMsg.style.color = "#888888";
        });

        /* Trigger Microsoft Login Flow */
        document.getElementById('msLoginBtn').addEventListener('click', () => {
            modalError.innerText = "Opening browser... please log in!";
            modalError.style.color = "#ffb703";
            modalError.style.display = 'block';
            ipcRenderer.send('ms-login-start');
        });

        ipcRenderer.on('ms-login-success', (event, accountData) => {
            localStorage.setItem('eclipse_auth_type', 'microsoft');
            localStorage.setItem('eclipse_username', accountData.name);
            localStorage.setItem('eclipse_ms_token', JSON.stringify(accountData.token));

            currentAuthType = 'microsoft';
            updateAccountUI(accountData.name);
            modal.style.display = 'none';
            statusMsg.innerText = `Logged in as ${accountData.name}`;
            statusMsg.style.color = "#ffb703";
        });

        ipcRenderer.on('ms-login-error', (event, err) => {
            modalError.innerText = "Login failed or cancelled!";
            modalError.style.color = "#ff4d4d";
            modalError.style.display = 'block';
        });

        document.getElementById('discordBtn').addEventListener('click', () => {
            shell.openExternal('https://discord.gg/DUeAgbph79');
        });

        /* Launch Controls */
        const playBtn = document.getElementById('playBtn');
        const playBtnWrapper = document.getElementById('playBtnWrapper');
        const statusMsg = document.getElementById('statusMsg');

        playBtn.addEventListener('click', () => {
            const authType = localStorage.getItem('eclipse_auth_type') || 'cracked';
            const username = localStorage.getItem('eclipse_username');

            if (!username) {
                statusMsg.innerText = "Please log in before launching!";
                statusMsg.style.color = "#ff4d4d";
                document.getElementById('accountBtn').click();
                return;
            }

            const launchConfig = {
                authType: authType,
                username: username,
                msToken: localStorage.getItem('eclipse_ms_token'),
                ram: localStorage.getItem('eclipse_ram') || DEFAULTS.ram,
                behavior: localStorage.getItem('eclipse_behavior') || DEFAULTS.behavior,
                width: localStorage.getItem('eclipse_width') || DEFAULTS.width,
                height: localStorage.getItem('eclipse_height') || DEFAULTS.height,
                fullscreen: localStorage.getItem('eclipse_fullscreen') === 'true',
                jvmFlags: localStorage.getItem('eclipse_jvm') || DEFAULTS.jvmFlags
            };

            statusMsg.style.color = "#888888";
            playBtn.innerText = "LAUNCHING...";
            playBtnWrapper.style.opacity = "0.75";
            playBtn.disabled = true;
            ipcRenderer.send('launch-game', launchConfig);
        });

        ipcRenderer.on('launch-progress', (event, data) => {
            if (data.type === 'status') {
                statusMsg.innerText = data.task;
            } else if (data.type === 'progress') {
                statusMsg.innerText = `Verifying game files... (${data.percentage}%)`;
            }
        });

        ipcRenderer.on('game-started', () => {
            playBtn.innerText = "LAUNCHED";
            statusMsg.innerText = "Game is currently running";
        });

        ipcRenderer.on('game-closed', () => {
            playBtn.innerText = "LAUNCH";
            playBtnWrapper.style.opacity = "1";
            playBtn.disabled = false;
            statusMsg.innerText = "Ready to launch";
        });

        document.getElementById('closeBtn').addEventListener('click', () => window.close());
        document.getElementById('minBtn').addEventListener('click', () => ipcRenderer.send('window-min'));
    </script>
</body>
</html>
