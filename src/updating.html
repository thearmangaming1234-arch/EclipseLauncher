<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Updating Eclipse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="update-progress-window">
  <main class="update-progress-card">
    <img src="../assets/EclipseLogo+Name397x165.png" alt="Eclipse Launcher">
    <div class="update-spinner" role="status" aria-label="Updating"></div>
    <h1>Eclipse Launcher is updating</h1>
    <p>This should only take a moment. Eclipse will reopen when it’s ready.</p>
  </main>
</body>
</html>
